name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Npm install
        run: npm ci

      - name: Composer install
        run: composer install

      - name: Running lint check
        run: npm run lint

  js-unit-test:
    runs-on: ubuntu-latest

    name: JavaScript Unit Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Npm install
        run: npm ci

      - name: Running JavaScript unit tests
        run: npm run test:unit

  e2e-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4', '8.5']
        wp: ['WordPress', 'WordPress#7.1.2']
        # Short labels for job names.
        include:
          - wp: WordPress
            wp-label: WP trunk
          - wp: WordPress#7.1.2
            wp-label: WP 7.1.2

    name: E2E / PHP ${{ matrix.php }} / ${{ matrix.wp-label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: npx playwright install chromium --with-deps

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version
          npm run wp-env-test run cli wp cli info

      - name: Running e2e tests
        run: npm run test:e2e

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failures-artifacts-${{ matrix.php }}-${{ matrix.wp }}
          path: artifacts
          if-no-files-found: ignore

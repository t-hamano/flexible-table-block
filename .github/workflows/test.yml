name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    name: Build, Lint and Unit Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install

      - name: Running lint check
        run: npm run lint

      - name: Running unit tests
        run: npm run test:unit

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          if-no-files-found: error

  e2e:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            wp: WordPress
          - php: '8.2'
            wp: WordPress#7.1.2

          - php: '8.4'
            wp: WordPress
          - php: '8.4'
            wp: WordPress#7.1.2

          - php: '8.5'
            wp: WordPress
          - php: '8.5'
            wp: WordPress#7.1.2

    name: PHP ${{ matrix.php }} / ${{ matrix.wp }} E2E Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Npm install
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Install Playwright dependencies
        run: npx playwright install chromium --with-deps

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version
          npm run wp-env-test run cli wp cli info

      - name: Running e2e tests
        run: npm run test:e2e

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failures-artifacts-${{ matrix.php }}-${{ matrix.wp }}
          path: artifacts
          if-no-files-found: ignore
